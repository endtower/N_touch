<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Abyss 管家</title>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --surface2: #0b1220;
  --border: #334155; --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --accent: #818cf8; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; overflow: hidden; }
.app { display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
nav { background: #0b1220; padding: 18px 0; border-right: 1px solid var(--border); grid-row: 1 / 3; }
nav h1 { font-size: 18px; color: #a5b4fc; padding: 0 18px 14px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
nav button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text2);
             padding: 11px 18px; font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; }
nav button:hover { color: var(--text); background: rgba(129,140,248,.08); }
nav button.active { color: var(--text); border-left-color: var(--accent); background: rgba(129,140,248,.12); }
nav .foot { position: absolute; bottom: 14px; left: 18px; right: 14px; font-size: 11px; color: var(--text3); }
main { overflow-y: auto; padding: 22px 26px; }
.statusbar { grid-column: 2; background: var(--surface2); border-top: 1px solid var(--border);
             padding: 7px 22px; font-size: 12px; color: var(--text2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
.card h3 { font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text3); display: inline-block; }
.dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.bad { background: var(--bad); }
.dot.warn { background: var(--warn); }
.meta { font-size: 12px; color: var(--text2); font-family: Consolas, monospace; margin: 6px 0 12px; line-height: 1.6; white-space: pre-wrap; }
.err { color: var(--bad); }
button.act { background: rgba(129,140,248,.15); color: var(--text); border: 1px solid var(--accent);
             border-radius: 6px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; margin-right: 8px; }
button.act:hover { background: rgba(129,140,248,.3); }
button.act.danger { border-color: var(--bad); color: var(--bad); background: rgba(248,113,113,.08); }
button.act.danger:hover { background: rgba(248,113,113,.2); }
button.act:disabled { opacity: .4; cursor: default; }
.page { display: none; } .page.active { display: block; }
.page h2 { font-size: 19px; margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text3); }
pre.log { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
          font-family: Consolas, monospace; font-size: 11.5px; color: var(--text2); height: calc(100vh - 210px);
          overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
select, input { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
                border-radius: 6px; padding: 7px 10px; font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
label { font-size: 12.5px; color: var(--text2); min-width: 150px; }
.hint { font-size: 11px; color: var(--text3); }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>Abyss 管家</h1>
    <button class="active" data-page="overview">总览与控制</button>
    <button data-page="logs">日志</button>
    <button data-page="config">配置</button>
    <button data-page="update">更新</button>
    <div class="foot">AbyssLauncher · 管理服务 <span id="svc-ver">—</span></div>
  </nav>
  <main>
    <div class="page active" id="page-overview">
      <h2>总览与控制</h2>
      <div class="card">
        <h3><span class="dot" id="dot-core"></span> Abyss Core <span class="badge" id="badge-core">—</span></h3>
        <div class="meta" id="meta-core">—</div>
        <button class="act" onclick="cmd('core','start')">启动</button>
        <button class="act" onclick="cmd('core','stop')">停止（优雅）</button>
        <button class="act" onclick="cmd('core','restart')">重启</button>
      </div>
      <div class="card">
        <h3><span class="dot" id="dot-snowluma"></span> SnowLuma <span class="badge">QQ 登录</span></h3>
        <div class="meta" id="meta-snowluma">—</div>
        <button class="act" onclick="cmd('snowluma','start')">启动</button>
        <button class="act" onclick="cmd('snowluma','stop')">停止</button>
      </div>
    </div>
    <div class="page" id="page-logs">
      <h2>日志</h2>
      <div class="row">
        <select id="log-source">
          <option value="core">Core 主日志</option>
          <option value="core_out">Core 启动输出</option>
          <option value="snowluma">SnowLuma 输出</option>
          <option value="service">管理服务</option>
        </select>
        <span class="hint">每 2 秒自动刷新</span>
      </div>
      <pre class="log" id="log-box">（暂无日志）</pre>
    </div>
    <div class="page" id="page-config">
      <h2>Core 配置（写入 .env.dev，保存后重启 Core 生效）</h2>
      <div class="card">
        <div class="row"><label>Web 前端端口 (WEB_WS_PORT)</label><input id="cfg-WEB_WS_PORT" style="width:110px"></div>
        <div class="row"><label>QQ 接入端口 (ONEBOT_WS_PORT)</label><input id="cfg-ONEBOT_WS_PORT" style="width:110px"></div>
        <div class="row"><label>QQ 接入路径 (ONEBOT_WS_PATH)</label><input id="cfg-ONEBOT_WS_PATH" style="width:260px"></div>
        <div class="row"><label>重设 QQ 接入令牌</label><input id="cfg-ONEBOT_ACCESS_TOKEN" type="password" style="width:260px" placeholder="留空 = 不修改"></div>
        <div class="row"><span class="hint" id="cfg-token-hint"></span></div>
        <button class="act" onclick="saveConfig()">保存（原子写入）</button>
        <span class="hint" id="cfg-save-msg" style="margin-left:12px"></span>
      </div>
    </div>
    <div class="page" id="page-update">
      <h2>更新</h2>
      <div class="card"><div class="meta">本地导入更新包（清单校验 / 停机替换 / 失败回退）在阶段 E 接入；
      在此之前请使用替换程序文件 + 保留数据目录的手动方式。</div></div>
    </div>
  </main>
  <div class="statusbar" id="statusbar">连接中…</div>
</div>
<script>
const $ = id => document.getElementById(id);
let followLog = true;

async function api(method, path, body) {
  const resp = await fetch(path, { method, headers: {"Content-Type": "application/json"},
                                   body: body ? JSON.stringify(body) : undefined });
  return { status: resp.status, body: await resp.json().catch(() => ({})) };
}

function dotFor(state) {
  if (state === "running") return "ok";
  if (state === "failed" || state === "conflict") return "bad";
  if (state === "starting" || state === "stopping") return "warn";
  return "";
}

async function refresh() {
  try {
    const { status, body } = await api("GET", "/v1/targets");
    if (status !== 200) throw new Error(body.message || status);
    $("statusbar").textContent = "管理服务正常 · " + new Date().toLocaleTimeString();
    for (const t of body.targets) {
      $("dot-" + t.name).className = "dot " + dotFor(t.state);
      const readyTxt = t.name === "core" ? (t.ready ? " · 业务就绪" : " · 业务未就绪") : "";
      $("meta-" + t.name).textContent =
        `状态 ${t.state}（期望 ${t.desired}）· pid ${t.pid ?? "—"} · 端口 ${t.ports.join("/")} · ` +
        `运行 ${t.uptime_sec ?? "—"}s · 重启 ${t.restarts} 次${readyTxt}` +
        (t.last_error ? `\n${t.last_error}` : "");
      if (t.name === "core") $("badge-core").textContent = t.managed ? "托管" : "外部/冲突";
    }
    if (document.getElementById("page-logs").classList.contains("active")) refreshLog();
  } catch (e) {
    $("statusbar").textContent = "与服务失去连接：" + e.message;
  }
}

async function cmd(name, kind) {
  const { status, body } = await api("POST", `/v1/targets/${name}/${kind}`);
  $("statusbar").textContent = body.message || (body.ok ? "完成" : "失败");
  refresh();
}

async function refreshLog() {
  const src = $("log-source").value;
  const { body } = await api("GET", `/v1/logs/${src}?lines=200`);
  const box = $("log-box");
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.textContent = (body.lines || []).join("\n") || "（暂无日志）";
  if (atBottom) box.scrollTop = box.scrollHeight;
}

async function loadConfig() {
  const { body } = await api("GET", "/v1/config/core");
  for (const [k, v] of Object.entries(body.fields || {})) {
    if (k === "ONEBOT_ACCESS_TOKEN_SET") continue;
    const el = $("cfg-" + k);
    if (el && el.value === "") el.value = v ?? "";
  }
  $("cfg-token-hint").textContent = body.fields?.ONEBOT_ACCESS_TOKEN_SET
    ? "当前已设置接入令牌（出于安全不回显）" : "尚未设置接入令牌";
}

async function saveConfig() {
  const fields = {};
  for (const k of ["WEB_WS_PORT", "ONEBOT_WS_PORT", "ONEBOT_WS_PATH"]) {
    const v = $("cfg-" + k).value.trim();
    if (v !== "") fields[k] = k.endsWith("PORT") ? Number(v) : v;
  }
  const tok = $("cfg-ONEBOT_ACCESS_TOKEN").value.trim();
  if (tok !== "") fields.ONEBOT_ACCESS_TOKEN = tok;
  const { status, body } = await api("PUT", "/v1/config/core", { fields });
  $("cfg-save-msg").textContent = status === 200
    ? "已保存，待应用（重启 Core 生效）" : (body.message || "保存失败");
  if (status !== 200) $("cfg-save-msg").style.color = "var(--bad)";
}

document.querySelectorAll("nav button[data-page]").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    $("page-" + b.dataset.page).classList.add("active");
    if (b.dataset.page === "logs") refreshLog();
    if (b.dataset.page === "config") loadConfig();
  });
});
$("log-source").addEventListener("change", refreshLog);
setInterval(refresh, 2000);
setInterval(() => { api("GET", "/v1/info").then(({body}) =>
  $("svc-ver").textContent = body.version ?? "—").catch(() => {}); }, 5000);
refresh();
loadConfig();
</script>
</body>
</html>
