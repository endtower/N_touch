name: Release

# 发布构建：生成单 EXE 入口与各组件更新包，并上传为该版本的 GitHub Release 资产。
# 用户侧的「更新中心」直接读 latest release 的清单，因此每次发布必须包含全部组件的
# latest / versions 清单；版本包同时保留在本版本的永久下载地址上。
#
# 产物发布到独立的公开仓库 endtower/weaklink-releases：本仓库含源码与开发历史，
# 更新源只应指向只放构建产物的仓库，二者分开后更新地址稳定、也不会误发源码。
# 需要在本仓库 Settings → Secrets → Actions 配置 RELEASE_TOKEN（对发布仓库有
# contents:write 权限的令牌），默认的 github.token 只能写本仓库。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v0.4.0）。留空则按 core 版本自动生成 v<core>"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dev
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_REPO: endtower/weaklink-releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dev/web_frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 安装 Core 依赖
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: 构建 Web UI（Core 源码组件必须携带匹配前端）
        working-directory: dev/web_frontend
        run: npm ci; npm run build

      - name: 计算发布版本
        id: ver
        shell: pwsh
        run: |
          $core = (Get-Content component_versions.json -Raw | ConvertFrom-Json).core
          # 手动触发可用 inputs.tag 指定；推送 tag 触发时沿用该 tag；都没有则用 v<core>
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) { $tag = "v$core" }
          $meta = "releases/core-$core.json"
          if (-not (Test-Path $meta)) {
            throw "缺少 Core 发布说明 $meta；请先补写本次版本的变更与兼容说明"
          }
          "core=$core" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "metadata=$meta" >> $env:GITHUB_OUTPUT

      - name: 取回上一版清单（保留历史版本列表）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../cache/builds/previous-packages | Out-Null
          New-Item -ItemType Directory -Force ../cache/builds/previous-manifests | Out-Null
          $prev = gh api "repos/${{ env.RELEASE_REPO }}/releases?per_page=10" |
            ConvertFrom-Json | Where-Object { $_.tag_name -ne "${{ steps.ver.outputs.tag }}" } |
            Select-Object -First 1
          if (-not $prev) { Write-Host "首次发布，无历史清单"; exit 0 }
          gh release download $prev.tag_name --pattern "*-versions.json" -D ../cache/builds/previous-manifests --clobber
          Write-Host "历史清单来自 $($prev.tag_name)"

      - name: 拆分历史清单为单版本清单
        shell: python
        run: |
          import json, pathlib
          src = pathlib.Path("../cache/builds/previous-manifests")
          dst = pathlib.Path("../cache/builds/previous-packages")
          if not src.is_dir():
              raise SystemExit(0)
          for path in src.glob("*-versions.json"):
              data = json.loads(path.read_text(encoding="utf-8"))
              for release in data.get("releases", []):
                  name, version = data["component"], release["version"]
                  (dst / f"{name}-{version}.json").write_text(
                      json.dumps(release, ensure_ascii=False, indent=2), encoding="utf-8")

      - name: 构建发布包
        shell: pwsh
        run: |
          $buildArgs = @(
            "scripts/build_public_release.py",
            "--output", "../cache/builds/public",
            "--feed-base-url", "https://github.com/${{ env.RELEASE_REPO }}/releases/latest/download",
            "--package-base-url", "https://github.com/${{ env.RELEASE_REPO }}/releases/download/${{ steps.ver.outputs.tag }}",
            "--metadata", "${{ steps.ver.outputs.metadata }}"
          )
          if (Test-Path ../cache/builds/previous-packages/*.json) { $buildArgs += @("--previous-releases", "../cache/builds/previous-packages") }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }

      - name: 校验产物
        shell: pwsh
        run: |
          $expected = @("core", "manager", "launcher")
          foreach ($c in $expected) {
            foreach ($suffix in @("latest", "versions")) {
              $f = "../cache/builds/public/packages/$c-$suffix.json"
              if (-not (Test-Path $f)) { throw "缺少 $f" }
            }
          }
          if (-not (Test-Path "../cache/builds/public/download/AbyssLauncher.exe")) { throw "缺少单 EXE 入口" }

      - name: 校验 Core 运行环境可导入
        shell: pwsh
        run: |
          # 运行环境只装 requirements.txt 里的依赖；这里实际跑一遍导入，
          # 防止漏装依赖直到用户端才报 ModuleNotFoundError（如向量比对的库）。
          $pkg = Get-ChildItem "../cache/builds/public/packages/core-*.zip" | Select-Object -First 1
          if (-not $pkg) { throw "缺少 Core 版本包" }
          $tmp = Join-Path $env:RUNNER_TEMP "core-runtime-check"
          Expand-Archive -Path $pkg.FullName -DestinationPath $tmp -Force
          $py = Join-Path $tmp "components/core/runtime/python.exe"
          if (-not (Test-Path $py)) { throw "Core 包缺少 runtime/python.exe" }
          & $py -c "import fastapi, uvicorn, requests, aiohttp, aiofiles, aiosqlite, numpy, dotenv, pystray, PIL, pydantic, openai, httpx"
          if ($LASTEXITCODE -ne 0) { throw "Core 运行环境缺少依赖" }

      - name: 创建 Release 并上传资产
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $assets = @("../cache/builds/public/download/AbyssLauncher.exe") + (Get-ChildItem ../cache/builds/public/packages -File | ForEach-Object FullName)
          $notes = "core ${{ steps.ver.outputs.core }} · 直接下载 AbyssLauncher.exe 即可安装与更新；更新中心读取本次发布的 latest 清单。"
          gh release view $tag --repo "${{ env.RELEASE_REPO }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo "${{ env.RELEASE_REPO }}" --clobber
          } else {
            gh release create $tag @assets --repo "${{ env.RELEASE_REPO }}" --title "Abyss $tag" --notes $notes
          }
