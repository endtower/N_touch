[tool.ruff]
# 全局配置
line-length = 100

[tool.ruff.lint]
# 忽略特定规则
ignore = [
    # 忽略尾随空格（对应Pylint C0303）
    "W291",  # 行尾空格
    "W293",  # 文件末尾空白行
    # 忽略命名风格（对应Pylint C0103）
    "N801",  # 类属性不符合蛇形命名法
    "N802",  # 函数参数不符合蛇形命名法
    "N803",  # 局部变量不符合蛇形命名法
    "N804",  # 第一个参数不符合self/cls命名
    "N805",  # 常量不符合大写命名法
    "N806",  # 变量名不符合小写命名法
    "N815",  # 类名不符合驼峰命名法
    "N816",  # 函数名不符合蛇形命名法
    "N817",  # 变量名不符合蛇形命名法
    # 测试文件常用 sys.path 注入后再 import
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"adapt/**/tests/*.py" = ["E402", "F841"]
"**/tests/*.py" = ["E402", "F841"]
